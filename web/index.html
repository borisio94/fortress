<!DOCTYPE html>
<html lang="fr">
<head>
  <!--
    Le placeholder $FLUTTER_BASE_HREF est remplacé au build par la valeur
    passée à `flutter build web --base-href "..."`.
      - Build local par défaut         → "/"
      - GitHub Actions (production)    → "/fortress/" (cf. workflow CI)
    Ne PAS coder en dur "/fortress/" ici, sinon `flutter run -d chrome`
    casse en dev.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <!--
    Compat migration hash→path routing (2026-05-27).
    Les anciens liens partagés (catalogue, promo, etc.) suivent le format
    `https://<host>/#/catalogue/...` (hash routing). Depuis le passage à
    PathUrlStrategy, le fragment n'est plus interprété par GoRouter, donc
    ces liens atterriraient sur la landing page. Ce shim détecte un hash
    qui débute par `#/` et réécrit la barre d'adresse vers le path
    équivalent AVANT le boot Flutter. Préserve les anciens short_links
    déjà chez les clients/partenaires.
  -->
  <script>
    (function() {
      if (window.location.hash && window.location.hash.indexOf('#/') === 0) {
        var rewritten = window.location.origin
          + window.location.hash.substring(1);  // strip leading '#'
        window.location.replace(rewritten);
      }
    })();
  </script>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Fortress POS — caisse multi-boutique pour commerçants.">

  <!-- ── Open Graph / aperçu réseaux sociaux (Facebook, WhatsApp, Twitter) ──
       STATIQUE : carte Fortress générique (le crawler Facebook n'exécute pas
       le JavaScript → impossible d'injecter des OG par boutique côté client ;
       l'OG par boutique vit dans la Cloud Function functions/index.html, à
       activer le jour où Blaze est dispo). Orienté client final, pas B2B. -->
  <meta property="og:type" content="website"/>
  <meta property="og:site_name" content="Fortress"/>
  <meta property="og:title" content="Commandez en ligne — Catalogue"/>
  <meta property="og:description" content="Parcourez le catalogue et commandez en quelques clics · Livraison à domicile · Paiement à la réception"/>
  <meta property="og:image" content="https://fortress-pos.web.app/icons/Icon-512.png"/>
  <meta name="twitter:card" content="summary_large_image"/>
  <meta name="twitter:title" content="Commandez en ligne — Catalogue"/>
  <meta name="twitter:description" content="Livraison à domicile · Paiement à la réception"/>
  <meta name="twitter:image" content="https://fortress-pos.web.app/icons/Icon-512.png"/>

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Fortress POS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Fortress POS</title>
  <link rel="manifest" href="manifest.json">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#534AB7">

  <style>
    /* Splash inline — visible avant que flutter_bootstrap.js charge.
       Se masque sur l'évènement Flutter `flutter-first-frame`. */
    html, body { margin: 0; padding: 0; background: #534AB7; }
    #fortress-splash {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: linear-gradient(135deg, #534AB7 0%, #6B5DD3 100%);
      z-index: 9999;
      transition: opacity 280ms ease-out;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #fortress-splash img {
      width: 96px; height: 96px;
      border-radius: 22px;
      box-shadow: 0 12px 36px rgba(0,0,0,0.25);
      margin-bottom: 28px;
    }
    #fortress-splash .label {
      color: #fff; font-size: 15px; font-weight: 600;
      letter-spacing: 0.3px; opacity: 0.92; margin-top: 18px;
    }
    #fortress-splash .spinner {
      width: 32px; height: 32px;
      border: 3px solid rgba(255,255,255,0.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: fortress-spin 0.85s linear infinite;
    }
    @keyframes fortress-spin { to { transform: rotate(360deg); } }
    #fortress-splash.hidden { opacity: 0; pointer-events: none; }
  </style>
</head>
<body style="background:#534AB7">
  <!--
    Splash de marque placé EN PREMIER dans le body → peint dès que le
    navigateur parse le body, AVANT tout script → réduit au maximum l'écran
    noir de démarrage (surtout dans les navigateurs in-app lents type
    WhatsApp/Instagram). Se masque sur `flutter-first-frame`.
  -->
  <div id="fortress-splash" role="status" aria-label="Chargement de Fortress POS">
    <img src="icons/Icon-192.png" alt="">
    <div class="spinner"></div>
    <div class="label">Fortress POS</div>
  </div>
  <script>
    // Flutter dispatche cet évènement quand le 1er frame est rendu.
    // Fallback timeout 8s au cas où l'évènement ne firerait pas (erreur boot).
    (function () {
      var hideSplash = function () {
        var s = document.getElementById('fortress-splash');
        if (!s) return;
        s.classList.add('hidden');
        setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 320);
      };
      window.addEventListener('flutter-first-frame', hideSplash);
      setTimeout(hideSplash, 8000);
    })();
  </script>

  <!--
    Purge du service worker hérité (async → ne bloque pas le rendu du splash).
    L'ancienne stratégie PWA offline-first enregistrait un SW qui servait une
    version obsolète et ne se mettait jamais à jour. On build désormais en
    --pwa-strategy=none ; ce script désinstalle un éventuel SW hérité + vide
    ses caches, puis recharge UNE fois (garde sessionStorage anti-boucle).
    getRegistrations() vide → no-op aux chargements suivants.
  -->
  <script>
    (function () {
      if (!('serviceWorker' in navigator)) return;
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        if (!regs || !regs.length) return;
        Promise.all(regs.map(function (r) { return r.unregister(); }))
          .then(function () {
            if (window.caches && caches.keys) {
              return caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) {
                  return caches.delete(k);
                }));
              });
            }
          })
          .then(function () {
            if (!sessionStorage.getItem('fortress-sw-purged')) {
              sessionStorage.setItem('fortress-sw-purged', '1');
              location.reload();
            }
          })
          .catch(function () { /* best-effort, on n'empêche pas le boot */ });
      });
    })();
  </script>

  <!--
    Chargement de Flutter via createElement (PAS document.write, qui peut
    retarder le 1er rendu du splash). Cache-buster `v` = timestamp par build →
    force le re-fetch de flutter_bootstrap.js après chaque deploy.
  -->
  <script>
    (function () {
      var s = document.createElement('script');
      s.src = 'flutter_bootstrap.js?v=' + Date.now();
      s.async = true;
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
