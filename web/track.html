<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Suivi de commande</title>
<meta name="description" content="Suivez et validez votre commande — paiement à la livraison." />
<meta property="og:type" content="website" />
<meta property="og:title" content="Suivi de votre commande" />
<meta property="og:description" content="Vérifiez et validez votre commande en un clic — paiement à la livraison." />
<link rel="preconnect" href="https://hyxvussnlnvbkalqzovb.supabase.co" crossorigin />
<style>
  :root{
    /* Thème sombre — aligné sur l'application (cf. catalogue.html). */
    --brand:#8B5CF6; --brand-l:#A78BFA; --brand-d:#6C3FC7; --brand-s:#2A2140;
    --ink:#F1F5F9; --ink2:#A8B3C4; --hint:#7A8699;
    --line:#334155; --bg:#1E293B; --soft:#0F172A;
    --ok:#34D399; --okS:#15321F; --warn:#FBBF24; --warnS:#3B2911;
    --err:#F87171; --errS:#3A1818;
    --radius:14px; --shadow:0 1px 3px rgba(20,20,40,.06),0 6px 24px rgba(20,20,40,.05);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);background:var(--soft);line-height:1.45;-webkit-font-smoothing:antialiased}
  img{display:block;max-width:100%}
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  .hide{display:none!important}

  .wrap{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--soft)}

  /* ---- Header ---- */
  .head{background:linear-gradient(135deg,var(--brand),var(--brand-l));
    padding:calc(22px + env(safe-area-inset-top)) 20px 22px;display:flex;align-items:center;gap:12px}
  .head .logo{width:40px;height:40px;border-radius:11px;object-fit:cover;background:#fff;
    border:1px solid rgba(255,255,255,.4);flex:0 0 auto}
  .head .htxt{min-width:0}
  .head .hname{font-size:18px;font-weight:800;color:#fff;letter-spacing:-.2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .head .hsub{font-size:11.5px;color:rgba(255,255,255,.88);margin-top:2px}

  /* ---- Body ---- */
  .body{padding:16px}
  .card{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
  .card-t{font-size:14px;font-weight:800;color:var(--ink)}
  .card-sub{font-size:11px;color:var(--ink2);margin-top:3px;line-height:1.4}

  /* coordonnées */
  .coord{display:flex;align-items:flex-start;gap:9px;margin-top:12px}
  .coord:first-of-type{margin-top:12px}
  .coord svg{width:16px;height:16px;color:var(--brand);flex:0 0 auto;margin-top:2px}
  .coord .ck{font-size:10px;font-weight:700;letter-spacing:.4px;color:var(--hint);text-transform:uppercase}
  .coord .cv{font-size:13.5px;font-weight:600;color:var(--ink);margin-top:1px;word-break:break-word}

  /* statut */
  .status{display:flex;align-items:center;gap:9px}
  .status svg{width:20px;height:20px;flex:0 0 auto}
  .status .slab{font-size:13.5px;font-weight:700}
  .meta{font-size:12px;color:var(--ink2);margin-top:9px}
  .note{font-size:11.5px;font-style:italic;color:var(--ink2);margin-top:8px}

  /* produits */
  .item{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
  .item:first-of-type{border-top:none;padding-top:4px}
  .item .ph{width:54px;height:54px;border-radius:9px;overflow:hidden;background:var(--soft);
    flex:0 0 auto;display:flex;align-items:center;justify-content:center;border:1px solid var(--line)}
  .item .ph img{width:100%;height:100%;object-fit:cover}
  .item .ph .ico{color:var(--hint)}
  .item .iname{font-size:13px;font-weight:600;color:var(--ink);line-height:1.3;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .item .iqty{font-size:11px;color:var(--ink2);margin-top:2px}
  .item .iline{font-size:13.5px;font-weight:800;color:var(--brand);flex:0 0 auto;white-space:nowrap}

  /* total */
  .total{background:var(--brand-s);border:none;display:flex;align-items:center;gap:12px}
  .total svg{width:22px;height:22px;color:var(--brand);flex:0 0 auto}
  .total .tlab{font-size:14px;font-weight:700;color:var(--ink);flex:1}
  .total .tval{font-size:19px;font-weight:900;color:var(--brand)}
  .total .tpay{font-size:11px;color:var(--ink2);font-weight:600;margin-top:2px}

  /* boutons */
  .btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
    font-weight:800;font-size:14.5px;border-radius:12px;padding:15px;line-height:1.1}
  .btn-ok{background:var(--ok);color:#fff;margin-bottom:12px}
  .btn-ok:active{filter:brightness(.95)}
  .btn-ok:disabled{opacity:.6}
  .btn svg{width:18px;height:18px}
  .spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;
    border-radius:50%;animation:r .8s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}

  /* lien catalogue */
  .cat{background:var(--soft);border:1px solid var(--line)}
  .cat .crow{display:flex;align-items:center;gap:8px}
  .cat svg{width:18px;height:18px;color:var(--brand);flex:0 0 auto}
  .cat .ct{font-size:13px;font-weight:700;color:var(--ink)}
  .cat-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;width:100%;
    margin-top:11px;border:1.5px solid rgba(108,63,199,.45);color:var(--brand);
    font-size:12.5px;font-weight:700;border-radius:11px;padding:11px}
  .cat-btn:active{background:var(--brand-s)}

  /* états plein écran */
  .center{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:14px;text-align:center;padding:28px;color:var(--ink2)}
  .bspin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--brand);
    border-radius:50%;animation:r .8s linear infinite}

  /* toast */
  .toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));
    /* Fond sombre FIXE, pas `var(--ink)` : en thème sombre `--ink` est la
       couleur de TEXTE (claire), ce qui donnerait du blanc sur blanc. */
    transform:translateX(-50%) translateY(20px);max-width:90%;background:#0B1120;color:#fff;
    font-size:13px;font-weight:600;padding:12px 16px;border-radius:11px;box-shadow:var(--shadow);
    z-index:60;opacity:0;pointer-events:none;transition:.25s;text-align:center}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.ok{background:var(--ok)} .toast.err{background:var(--err)}
  .foot{text-align:center;color:var(--hint);font-size:12px;padding:6px 18px 24px}
</style>
</head>
<body>

<!--
  Purge d'un éventuel service worker hérité de l'ancienne PWA Flutter, qui
  intercepterait /track/** et servirait une vieille version. Identique à la
  purge de index.html. No-op si aucun SW. Recharge UNE fois (garde
  sessionStorage anti-boucle) pour repartir sur des assets frais.
-->
<script>
  (function () {
    if (!('serviceWorker' in navigator)) return;
    navigator.serviceWorker.getRegistrations().then(function (regs) {
      if (!regs || !regs.length) return;
      Promise.all(regs.map(function (r) { return r.unregister(); }))
        .then(function () {
          if (window.caches && caches.keys) {
            return caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (k) { return caches.delete(k); }));
            });
          }
        })
        .then(function () {
          if (!sessionStorage.getItem('fortress-sw-purged')) {
            sessionStorage.setItem('fortress-sw-purged', '1');
            location.reload();
          }
        })
        .catch(function () { /* best-effort */ });
    });
  })();
</script>

<div id="state" class="center"><div class="bspin"></div><div>Chargement de votre commande…</div></div>
<div class="wrap hide" id="wrap"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
(function(){
  var SUPA = "https://hyxvussnlnvbkalqzovb.supabase.co";
  var ANON = "sb_publishable_R7Jg-Tx4WRMkVI5TMC4jpQ_p8NHq4bd";
  var REST = SUPA + "/rest/v1/rpc/";
  var FMT = new Intl.NumberFormat("fr-FR");
  var money = function(n){ return FMT.format(Math.round(n||0)) + " FCFA"; };
  var esc = function(s){ return (s==null?"":String(s)).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); };

  // ───────── orderId depuis /track/<id> ─────────
  var path = location.pathname.replace(/\/+$/,"");
  var ORDER_ID = decodeURIComponent((path.split("/track/")[1]||"").split("/")[0]||"");

  function rpc(name, body){
    return fetch(REST+name,{
      method:"POST",
      headers:{ "apikey":ANON, "Authorization":"Bearer "+ANON, "Content-Type":"application/json" },
      body: JSON.stringify(body||{})
    }).then(function(r){
      if(!r.ok) return r.text().then(function(t){ throw new Error("RPC "+name+" "+r.status+" "+t); });
      return r.text().then(function(t){ return t ? JSON.parse(t) : null; });
    });
  }

  function img(url, w){
    if(!url) return "";
    if(url.indexOf("/storage/v1/object/public/")>-1){
      return url.replace("/storage/v1/object/public/","/storage/v1/render/image/public/")
        + (url.indexOf("?")>-1?"&":"?") + "width="+w+"&quality=70&resize=contain";
    }
    return url;
  }

  // ───────── Helpers métier (réplique OrderTrackingPage) ─────────
  function effPrice(it){
    var base = +(it.unit_price)||0;
    var custom = it.custom_price!=null ? +it.custom_price : null;
    var disc = +(it.discount)||0;
    return (custom!=null?custom:base) * (1 - disc/100);
  }
  function splitAddress(notes){
    if(!notes) return {address:null, rest:null};
    var addr=[], rest=[];
    String(notes).split("\n").forEach(function(l){
      var t=l.trim();
      if(t.indexOf("Adresse :")===0 || t.indexOf("Adresse:")===0){
        addr.push(t.replace(/^Adresse\s*:\s*/,""));
      } else rest.push(l);
    });
    var a=addr.join(" · ").trim(), r=rest.join("\n").trim();
    return {address:a||null, rest:r||null};
  }
  function statusBadge(s){
    switch(s){
      case "scheduled":  return {lab:"En attente de votre validation", c:"var(--warn)", ic:"clock"};
      case "processing": return {lab:"Validée — en préparation",       c:"var(--ok)",   ic:"truck"};
      case "completed":  return {lab:"Livrée",                         c:"var(--ok)",   ic:"check"};
      case "cancelled":
      case "refused":    return {lab:"Annulée",                        c:"var(--err)",  ic:"x"};
      case "refunded":   return {lab:"Remboursée",                     c:"var(--err)",  ic:"x"};
      default:           return {lab:s||"—",                           c:"var(--brand)",ic:"info"};
    }
  }
  var ICONS = {
    clock:"<circle cx='12' cy='12' r='9'/><path d='M12 7v5l3 2'/>",
    truck:"<path d='M1 4h13v11H1z'/><path d='M14 8h4l3 3v4h-7'/><circle cx='5.5' cy='18.5' r='2'/><circle cx='17.5' cy='18.5' r='2'/>",
    check:"<circle cx='12' cy='12' r='9'/><path d='M8 12l3 3 5-6'/>",
    x:"<circle cx='12' cy='12' r='9'/><path d='M15 9l-6 6M9 9l6 6'/>",
    info:"<circle cx='12' cy='12' r='9'/><path d='M12 11v5M12 8h.01'/>"
  };
  function fmtDate(v){
    if(!v) return null;
    var d = new Date(v); if(isNaN(d.getTime())) return null;
    function p(n){ return String(n).padStart(2,"0"); }
    return p(d.getDate())+"/"+p(d.getMonth()+1)+"/"+d.getFullYear()+" à "+p(d.getHours())+":"+p(d.getMinutes());
  }

  function toast(msg, kind){
    var t=document.getElementById("toast");
    t.textContent=msg; t.className="toast on "+(kind||"");
    clearTimeout(t._tm); t._tm=setTimeout(function(){ t.className="toast "+(kind||""); }, 4200);
  }

  // ───────── State + parse ─────────
  var ORDER=null, validating=false;
  function parse(m){
    var items = Array.isArray(m.items)? m.items.filter(function(x){return x&&typeof x==="object";}).map(function(it){
      return {
        name:(it.product_name||it.name||"").toString(),
        qty:(+(it.quantity)||1),
        price:effPrice(it),
        imageUrl:(it.image_url||null)
      };
    }) : [];
    var split = splitAddress(m.notes!=null?String(m.notes):null);
    var itemsTotal = items.reduce(function(s,it){return s+it.price*it.qty;},0);
    var discount = +(m.discount_amount)||0;
    var tax = +(m.tax_rate)||0;
    return {
      id:(m.id||"").toString(),
      shopId:(m.shop_id||"").toString(),
      shopName:(m.shop_name||"").toString(),
      status:(m.status||"scheduled").toString(),
      clientName:(m.client_name||"").toString()||null,
      clientPhone:(m.client_phone||"").toString()||null,
      clientAddress:split.address,
      notes:split.rest,
      items:items,
      scheduledAt:m.scheduled_at||null,
      total:(itemsTotal - discount) * (1 + tax/100)
    };
  }

  // ───────── Render ─────────
  function render(){
    var o=ORDER, b=statusBadge(o.status);
    var coords=[];
    if(o.clientName)    coords.push(["<path d='M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2'/><circle cx='12' cy='7' r='4'/>","Nom",o.clientName]);
    if(o.clientPhone)   coords.push(["<path d='M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.6A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.7a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.4-1.1a2 2 0 0 1 2.1-.5c.9.3 1.8.5 2.7.6a2 2 0 0 1 1.7 2z'/>","Téléphone",o.clientPhone]);
    if(o.clientAddress) coords.push(["<path d='M21 10c0 6-9 12-9 12s-9-6-9-12a9 9 0 0 1 18 0z'/><circle cx='12' cy='10' r='3'/>","Adresse",o.clientAddress]);

    var sched = fmtDate(o.scheduledAt);

    var html =
      "<div class='head'>"
        + "<div class='logo' id='hLogo' style='display:none'></div>"
        + "<div class='htxt'><div class='hname'>"+esc(o.shopName||"Fortress")+"</div>"
        + "<div class='hsub'>Suivi de votre commande</div></div>"
      + "</div>"
      + "<div class='body'>";

    if(coords.length){
      html += "<div class='card'><div class='card-t'>Vos coordonnées</div>"
        + "<div class='card-sub'>Vérifiez que ces informations correspondent à ce que vous avez saisi. "
        + "En cas d'erreur, contactez la boutique avant de valider.</div>"
        + coords.map(function(c){
            return "<div class='coord'><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' "
              + "stroke-width='2' stroke-linecap='round' stroke-linejoin='round'>"+c[0]+"</svg>"
              + "<div><div class='ck'>"+esc(c[1])+"</div><div class='cv'>"+esc(c[2])+"</div></div></div>";
          }).join("")
        + "</div>";
    }

    // statut
    html += "<div class='card'>"
      + "<div class='status'><svg viewBox='0 0 24 24' fill='none' stroke='"+b.c+"' stroke-width='2' "
      + "stroke-linecap='round' stroke-linejoin='round'>"+ICONS[b.ic]+"</svg>"
      + "<span class='slab' style='color:"+b.c+"'>Statut : "+esc(b.lab)+"</span></div>"
      + (sched? "<div class='meta'>Livraison prévue : "+esc(sched)+"</div>":"")
      + (o.notes? "<div class='note'>"+esc(o.notes)+"</div>":"")
      + "</div>";

    // produits
    html += "<div class='card'><div class='card-t' style='margin-bottom:8px'>Vos produits</div>";
    if(!o.items.length){
      html += "<div class='note'>Aucun produit dans cette commande.</div>";
    } else {
      html += o.items.map(function(it){
        return "<div class='item'>"
          + "<div class='ph'>"+(it.imageUrl
              ? "<img src='"+esc(img(it.imageUrl,160))+"' onerror=\"this.parentNode.innerHTML='&#128230;'\">"
              : "<span class='ico'>&#128230;</span>")+"</div>"
          + "<div style='flex:1;min-width:0'><div class='iname'>"+esc(it.name||"(produit)")+"</div>"
          + "<div class='iqty'>"+it.qty+" × "+money(it.price)+"</div></div>"
          + "<div class='iline'>"+money(it.price*it.qty)+"</div>"
          + "</div>";
      }).join("");
    }
    html += "</div>";

    // total
    html += "<div class='card total'>"
      + "<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='2' y='5' width='20' height='14' rx='2'/><path d='M2 10h20'/></svg>"
      + "<div class='tlab'>Total<div class='tpay'>Paiement à la livraison</div></div>"
      + "<div class='tval'>"+money(o.total)+"</div></div>";

    // validation
    if(o.status==="scheduled"){
      html += "<button class='btn btn-ok' id='valBtn'"+(validating?" disabled":"")+">"
        + (validating
            ? "<span class='spin'></span>Validation en cours…"
            : "<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='9'/><path d='M8 12l3 3 5-6'/></svg>Valider ma commande")
        + "</button>";
    }

    // lien catalogue (vers le catalogue rapide)
    html += "<div class='card cat'>"
      + "<div class='crow'><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z'/><path d='M3 6h18'/><path d='M16 10a4 4 0 0 1-8 0'/></svg>"
      + "<span class='ct'>Envie d'ajouter d'autres produits ?</span></div>"
      + "<a class='cat-btn' href='/catalogue/"+encodeURIComponent(o.shopId)+"'>"
      + "<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M3 9l1-5h16l1 5'/><path d='M5 9v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9'/></svg>"
      + "Voir le catalogue</a></div>";

    html += "</div><div class='foot'>🔒 Suivi sécurisé · Paiement à la livraison</div>";

    var wrap=document.getElementById("wrap");
    wrap.innerHTML=html;
    document.getElementById("state").classList.add("hide");
    wrap.classList.remove("hide");

    var vb=document.getElementById("valBtn");
    if(vb) vb.onclick=validate;
  }

  function validate(){
    if(validating) return;
    validating=true; render();
    rpc("validate_order_by_client",{p_order_id:ORDER_ID}).then(function(res){
      validating=false;
      if(res==="validated" || res==="already_validated"){
        toast("✓ Commande validée — la boutique prépare votre livraison.","ok");
        return load(true);
      }
      toast("Impossible de valider pour le moment. Contactez la boutique.","err");
      render();
    }).catch(function(){
      validating=false;
      toast("Impossible de valider la commande. Réessayez plus tard.","err");
      render();
    });
  }

  function fail(msg){
    document.getElementById("state").innerHTML =
      "<div style='font-size:40px'>📦</div><div>"+esc(msg)+"</div>";
    document.getElementById("state").classList.remove("hide");
    document.getElementById("wrap").classList.add("hide");
  }

  function load(silent){
    return rpc("get_tracked_order",{p_order_id:ORDER_ID}).then(function(res){
      if(!res){ fail("Commande introuvable. Vérifiez le lien reçu ou contactez la boutique."); return; }
      ORDER = parse(Array.isArray(res)? res[0] : res);
      document.title = ORDER.shopName? ("Suivi · "+ORDER.shopName) : "Suivi de commande";
      render();
    }).catch(function(e){
      console&&console.error&&console.error(e);
      if(!silent) fail("Commande introuvable.\nVérifiez le lien reçu ou contactez la boutique.");
    });
  }

  if(!ORDER_ID){ fail("Lien invalide."); return; }
  load(false);
})();
</script>
</body>
</html>
